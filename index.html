<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Selector</title>
</head>

<body>
    <h1>DOM Selector</h1>
    <!-- id selector -->
    <button id="btn">Submit</button>
    <!-- class selector -->
    <p class="para">Select by class</p>
    <!-- tagName selector -->
    <span>Select by tagName</span>
    <!-- querySelector -->
    <h2 id="heading">querySelector</h2>
    <!-- querySelectorAll -->
    <p class="paras">Para1</p>
    <p class="paras">Para2</p>
    <p class="paras">Para3</p>

    <!-- Tasks -->
    <h2 id="heading2">Hello world</h2>

    <p id="para">This is paragraph...</p>
    <button id="btn1">change text</button>

    <button id="bg">changeBG</button>
    <button id="show">click me</button>
    <script src="app.js"></script>

</body>

</html>
